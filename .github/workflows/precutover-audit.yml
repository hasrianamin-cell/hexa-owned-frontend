name: Pre-cutover read-only audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/precutover-audit.yml'
      - '.github/precutover-audit.once'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify staging routing and bytes
        shell: bash
        env:
          BASE: https://hasrianamin-cell.github.io/hexa-owned-frontend
          EXPECTED_DMU_SHA256: 098176577dc665259a59fccd31357afff3e5bdb3c522b4b51c1d99cb0a562720
        run: |
          set -euo pipefail
          mkdir -p audit
          root_http="$(curl -L -sS -o audit/root.html -w '%{http_code}' --connect-timeout 15 --max-time 60 "$BASE/")"
          dmu_slash_http="$(curl -L -sS -o audit/dmu-slash.html -w '%{http_code}' --connect-timeout 15 --max-time 60 "$BASE/teams/dmu/")"
          dmu_noslash_http="$(curl -L -sS -o audit/dmu-noslash.html -w '%{http_code}' --connect-timeout 15 --max-time 60 "$BASE/teams/dmu")"
          test "$root_http" = "200"
          test "$dmu_slash_http" = "200"
          test "$dmu_noslash_http" = "200"
          test "$(sha256sum audit/dmu-slash.html | awk '{print $1}')" = "$EXPECTED_DMU_SHA256"
          test "$(sha256sum audit/dmu-noslash.html | awk '{print $1}')" = "$EXPECTED_DMU_SHA256"
          {
            echo "rootHttp=$root_http"
            echo "dmuSlashHttp=$dmu_slash_http"
            echo "dmuNoSlashHttp=$dmu_noslash_http"
            echo "dmuNoSlashSha256=$(sha256sum audit/dmu-noslash.html | awk '{print $1}')"
          } > audit/routing-summary.txt

      - name: Capture GitHub Pages response headers
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -D audit/staging-root-headers.txt -o /dev/null             --connect-timeout 15 --max-time 60             https://hasrianamin-cell.github.io/hexa-owned-frontend/

      - name: Probe production-origin CORS without POST
        shell: bash
        run: |
          set -euo pipefail
          website='https://func-hexa-sales-intelligence-hacackeudjhbfzfd.southeastasia-01.azurewebsites.net/api/phase6WebsitePublicIntake'
          dmu='https://func-hexa-sales-intelligence-hacackeudjhbfzfd.southeastasia-01.azurewebsites.net/api/phase6DmuReadModel'
          context='https://func-hexa-sales-intelligence-hacackeudjhbfzfd.southeastasia-01.azurewebsites.net/api/phase6ContextReviewModel'
          overlay='https://func-hexa-sales-intelligence-hacackeudjhbfzfd.southeastasia-01.azurewebsites.net/api/phase6HumanOverlay'
          origin='https://hexahessman-th.com'

          preflight() {
            name="$1"; url="$2"; method="$3"; headers="$4"
            http="$(curl -sS -D "audit/${name}-cors-headers.txt" -o "audit/${name}-cors-body.txt"               -w '%{http_code}' --request OPTIONS               -H "Origin: $origin"               -H "Access-Control-Request-Method: $method"               -H "Access-Control-Request-Headers: $headers"               --connect-timeout 15 --max-time 60 "$url" || true)"
            echo "$name preflightHttp=$http" | tee -a audit/cors-summary.txt
          }

          : > audit/cors-summary.txt
          preflight website "$website" POST content-type
          preflight dmu "$dmu" GET authorization
          preflight context "$context" GET authorization
          preflight overlay "$overlay" GET authorization

      - name: Summarize pre-cutover evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "HEXA_PRECUTOVER_READONLY_AUDIT=COMPLETE"
            cat audit/routing-summary.txt
            echo
            echo "[CORS]"
            cat audit/cors-summary.txt
            echo
            echo "[ROOT_HEADERS]"
            tr -d '\\r' < audit/staging-root-headers.txt | grep -Ei '^(HTTP/|content-type:|content-security-policy:|strict-transport-security:|x-content-type-options:|x-frame-options:|referrer-policy:|permissions-policy:|cache-control:)' || true
            echo
            for f in audit/*-cors-headers.txt; do
              echo "[$f]"
              tr -d '\\r' < "$f" | grep -Ei '^(HTTP/|access-control-allow-origin:|access-control-allow-methods:|access-control-allow-headers:|vary:)' || true
            done
            echo "postPerformed=false"
            echo "formSubmitted=false"
            echo "dnsMutationPerformed=false"
            echo "customDomainMutationPerformed=false"
            echo "guardMutationPerformed=false"
            echo "backendMutationPerformed=false"
          } | tee audit/precutover-summary.txt

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: hexa-owned-frontend-precutover-audit
          path: audit
          retention-days: 30
